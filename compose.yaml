services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lab5-local-root-only
      MYSQL_DATABASE: lab5
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server2/docker/init-local.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server2
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: lab5
      DB_SSL: "false"
      DB_WRITER_USER: lab5_writer
      DB_WRITER_PASS: lab5-local-writer-only
      DB_READER_USER: lab5_reader
      DB_READER_PASS: lab5-local-reader-only
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  client:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./server1:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  mysql-data:
